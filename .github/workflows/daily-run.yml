name: DigForMe Daily Screener

on:
  schedule:
    - cron: '17 7 * * 1-5'
      timezone: 'America/Los_Angeles'  # Automatically handles PDT/PST transitions
  # Le trigger magique pour pouvoir lancer le script manuellement depuis GitHub !
  workflow_dispatch: 

jobs:
  run-screener:
    runs-on: ubuntu-latest # Plus rapide et stable que Mac pour ce script

    steps:
    - name: Récupération du code
      uses: actions/checkout@v4

    - name: Installation de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' 

    - name: Installation des librairies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas google-genai python-dotenv requests certifi lxml

    - name: Lancement du Screener DigForMe
      env:
        # Secrets requis (définis dans GitHub Settings → Secrets and variables → Actions)
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GMAIL_USER: ${{ secrets.GMAIL_USER }}
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
        
        # Paramètres optionnels (par défaut dans config.py si non définis)
        DROP_THRESHOLD: "-6.0"
        GEMINI_MODEL: "gemini-3.5-flash-lite"
        MIN_UPSIDE_THRESHOLD: "15.0"
        STOCKS_PER_GROUP: "4"
        DEBUG: "False"
      run: python screener.py
