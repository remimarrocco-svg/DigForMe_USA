name: DigForMe Daily Screener

on:
  schedule:
    # 14:00 UTC = 7:00 AM PDT (Lundi au Vendredi)
    - cron: '45 14 * * 1-5'
  # Le trigger magique pour pouvoir lancer le script manuellement depuis GitHub !
  workflow_dispatch: 

jobs:
  run-screener:
    runs-on: ubuntu-latest # Plus rapide et stable que Mac pour ce script

    steps:
    - name: Récupération du code
      uses: actions/checkout@v4

    - name: Installation de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' 

    - name: Installation des librairies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas google-genai python-dotenv requests lxml

    - name: Lancement du Screener DigForMe
      env:
        # C'est ici que GitHub injecte vos secrets en toute sécurité
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GMAIL_USER: ${{ secrets.GMAIL_USER }}
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      run: python screener.py